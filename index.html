{n:"365AI 导航",u:"https://365dh.cn",d:"500+ 工具，含站长点评",c:"nav"},
{n:"AI 导航台",u:"https://nav-ai.cn",d:"精选 AI 工具目录",c:"nav"},
{n:"AI 聚途",u:"https://aijutu.com",d:"工具与资讯聚合",c:"nav"},
{n:"ZhiNav",u:"https://zhinav.com",d:"智能导航入口",c:"nav"},
{n:"AI 全站导航",u:"https://ainall.cc",d:"4600+ 工具，33 分类",c:"nav"},
{n:"AI Stack Nav",u:"https://aistacknav.com",d:"工具榜单与目录汇总",c:"nav"}
];

/* ── 渲染 ─────────────────────────────── */
const HUES=["#2563eb","#7c3aed","#db2777","#ea580c","#0891b2","#059669","#ca8a04","#dc2626","#4f46e5","#0d9488"];
const catMap=Object.fromEntries(CATS.map(c=>[c[0],{label:c[1],hint:c[2],color:c[3]}]));
const out=document.getElementById("out"), catsEl=document.getElementById("cats"), qEl=document.getElementById("q");
let cur="all";

function avatar(name){
  let h=0; for(const ch of name) h=(h*31+ch.codePointAt(0))>>>0;
  const bg=HUES[h%HUES.length];
  const first=/[a-zA-Z]/.test(name[0])?name[0].toUpperCase():name[0];
  return `<span class="av" style="background:${bg}">${first}</span>`;
}
function tagOf(s){
  if(s.c==="signal") return '<span class="tagline sig">信号</span>';
  if(s.hot) return '<span class="tagline hot">热门</span>';
  if(s.c==="nav") return '<span class="tagline nav">参考</span>';
  return '';
}
function card(s){
  const host=s.u.replace(/^https?:\/\//,"").split("/")[0];
  return `<a class="card${s.c==="signal"?" is-signal":""}" href="${s.u}" target="_blank" rel="noopener">
    ${avatar(s.n)}
    <span class="meta">
      <span class="nm"><b>${s.n}</b>${tagOf(s)}</span>
      <span class="du">${s.d}<br>${host}</span>
    </span>
    <span class="cp" data-u="${s.u}" title="复制链接">复制</span>
  </a>`;
}
function counts(){
  const m={}; SITES.forEach(s=>m[s.c]=(m[s.c]||0)+1); return m;
}
function renderCats(){
  const n=counts();
  catsEl.innerHTML=[`<button class="chip ${cur==="all"?"on":""}" data-c="all">全部 ${SITES.length}</button>`]
    .concat(CATS.map(c=>`<button class="chip ${c[0]==="signal"?"hot ":""}${cur===c[0]?"on":""}" data-c="${c[0]}">${c[1]} ${n[c[0]]||0}</button>`)).join("");
}
function render(){
  const kw=qEl.value.trim().toLowerCase();
  let list=SITES.filter(s=>cur==="all"||s.c===cur);
  if(kw) list=list.filter(s=>(s.n+s.d+s.u+s.c).toLowerCase().includes(kw));
  if(!list.length){ out.innerHTML=`<div class="empty">没有匹配的站点　·　试试「重置」「视频」「榜单」</div>`; return; }
  if(kw||cur!=="all"){
    out.innerHTML=`<div class="sect"><h2>${kw?"搜索结果":"分类"}</h2><span>${list.length} 个</span></div><div class="grid">${list.map(card).join("")}</div>`;
    return;
  }
  // all：按分类分组，信号置顶
  out.innerHTML=CATS.map(c=>{
    const g=SITES.filter(s=>s.c===c[0]); if(!g.length) return "";
    const block=`<div class="sect ${c[0]==="signal"?"signal":""}"><h2>${c[1]}</h2><span>${c[2]}　·　${g.length} 个</span></div>
      <div class="grid">${g.map(card).join("")}</div>`;
    return block;
  }).join("");
}
catsEl.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  cur=b.dataset.c; renderCats(); render(); window.scrollTo({top:0,behavior:"smooth"});
});
qEl.addEventListener("input",render);
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
  if(e.key==="Escape"&&document.activeElement===qEl){qEl.value="";render();qEl.blur();}
});
document.addEventListener("click",e=>{
  const b=e.target.closest(".cp"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  navigator.clipboard.writeText(b.dataset.u).then(()=>toast("已复制链接"));
});
let tt;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1400);
}
document.getElementById("total").textContent=SITES.length;
document.getElementById("count").textContent=`共 ${SITES.length} 个站点，${CATS.length} 个分类　·　信号区追踪额度重置、模型发布、榜单价格，其余为精选工具与资源`;
renderCats(); render();
</script>
</body>
</html>
